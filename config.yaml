server:
  host:
  port: 8000
log:
  file:
    all: "logs/app.log"
    err: "logs/err.log"
  max_size: 5
  max_backups: 100
  max_age: 30
  compress: true
database:
  host:
  port:
  user:
  name:
  pass:
cache:
  host: 127.0.0.1
  port: 6379
  pass:
  db: 0
web:
  # Directory holding the built frontend (Nuxt static output), served at "/".
  # Relative paths are resolved against the working directory.
  dir: "web"
mirror:
  # Serve mirror content at /{key}/... through the caching proxy.
  proxy: true
  # host:port of the httpcached instance (see docs/plan-mirror-serving.md).
  cache_addr: "127.0.0.1:8001"
  # Host header used towards the cache; must be listed in its sites[].hosts.
  # Leave empty to use cache_addr.
  cache_host: ""
  # http or https. The cache is normally reached over plain HTTP on loopback.
  cache_scheme: "http"
  # Where the caching proxy stores cached objects, and its soft disk cap.
  # Both are written into the generated proxy configuration.
  cache_dir: "./cache_data"
  cache_max_size: "200GB"
  # Path of the caching proxy's configuration file. Setting it lets
  # `-dump-cache-config` run without an argument and makes startup warn when the
  # file is missing. It is never created for you: create the directory and run
  # the command.
  # cache_config: "../proxy/config.yaml"
  # Public hostname of this mirror site, used when rewriting redirects that
  # point back at us. Leave empty during development.
  host: ""
